<div class="container">
  <div
    *ngIf="showErrorMessage"
    class="alert alert-danger alert-dismissible fade show"
    role="alert"
  >
    <ul>
      <li *ngFor="let error of errors">{{ error }}</li>
    </ul>
    <button
      type="button"
      class="btn-close"
      data-bs-dismiss="alert"
      aria-label="Close"
      (click)="clearErrors()"
    ></button>
  </div>

  <div class="row">
    <div class="col-12">
      <app-post-create
        (postCreated)="onPostCreated($event)"
        (errors)="setErrors($event)"
      ></app-post-create>
    </div>
  </div>

  <div
    class="posts"
    infiniteScroll
    [infiniteScrollDistance]="1"
    [infiniteScrollThrottle]="100"
    (scrolled)="onWindowScroll()"
  >
    @for (post of posts; track post.id) {
      <div class="row">
        <div class="col-12">
          <div class="card mb-3">
            @defer (on viewport) {
              <app-post-details
                [post]="post"
                (deletedPost)="deletePost($event)"
                (errors)="setErrors($event)"
              ></app-post-details>
            } @placeholder {
              <div class="skeleton-card">
                <div
                  class="skeleton-header d-flex justify-content-between align-items-center"
                >
                  <div class="d-flex gap-2 align-items-center">
                    <div class="skeleton-avatar"></div>
                    <div>
                      <p class="skeleton-text skeleton-user"></p>
                      <p class="skeleton-text skeleton-date"></p>
                    </div>
                  </div>
                </div>
                <div class="card-body">
                  <p class="skeleton-text skeleton-post"></p>
                  <div class="skeleton-image-container"></div>
                </div>
              </div>
            }
          </div>
        </div>
      </div>
    }
  </div>
</div>

<button
  *ngIf="showBottomButton"
  class="btn btn-secondary btn-up-scroll"
  (click)="scrollToTop()"
>
  <i class="bi bi-arrow-up-circle-fill"></i>
</button>
