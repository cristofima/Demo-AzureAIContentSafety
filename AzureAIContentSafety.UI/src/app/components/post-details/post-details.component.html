<div class="card-header d-flex justify-content-between align-items-center">
  <div class="d-flex gap-2 align-items-center">
    <img src="assets/user-avatar.png" alt="User Avatar" class="avatar mr-2" />
    <div>
      <p class="mb-0 font-weight-bold">User</p>
      <p class="mb-0 text-muted">
        {{ post().createdAt | date: "medium" }}
      </p>
    </div>
  </div>
  <button
    class="btn btn-danger btn-sm"
    (click)="deletePost()"
    [disabled]="isDeleting()"
  >
    <i class="bi-trash"></i>
  </button>
</div>
<div class="card-body">
  <p class="card-text">{{ post().text }}</p>
  <div class="image-container" *ngIf="post().imagePath">
    <img
      [src]="post().imagePath"
      [class.blur]="post().imageIsBlurred"
      class="img-fluid rounded"
    />
    <button
      *ngIf="post().imageIsHarmful"
      class="toggle-blur-btn"
      (click)="toggleBlur()"
    >
      {{ post().imageIsBlurred ? "Show image" : "Hide image" }}
    </button>
  </div>
</div>
